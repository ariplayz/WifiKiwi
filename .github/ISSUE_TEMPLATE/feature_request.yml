name: Feature request
description: Suggest an enhancement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: please read [CONTRIBUTING.md](../CONTRIBUTING.md),
        especially the "Project goals (and hard limits)" section. Feature
        requests that violate those limits will be closed.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: legal
    attributes:
      label: Confirmation
      options:
        - label: This request does not involve jamming, high-power amplification, or attacks on equipment the user does not own.
          required: true
